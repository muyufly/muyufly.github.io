# 网站的基本信息
site:
  tab: muyufly # 浏览器标签栏上显示的文本
  title: muyufly # 网站的标题
  description: 一个收录写作、技术、生活、二次元的个人小站 # 网站的描述，用于SEO等
  language: en # 网站的语言，例如 "en" 是英文
  favicon: /favicon.ico # 网站的图标，用于浏览器标签栏和其他地方显示
  theme: # 更多主题 https://daisyui.com/docs/themes/
    light: winter # 主题的浅色模式
    dark: dracula # 主题的深色模式
    code: github-dark # 代码块的主题 https://expressive-code.com/guides/themes/
  date_format: ddd MMM DD YYYY # 日期格式设置，支持自定义格式
  blog: # 博客相关配置
    pageSize: 8 # 每页显示的文章数量
  menu: # 菜单配置
    - id: home # 菜单项的唯一标识符
      text: Home # 菜单项显示的文本
      href: / # 菜单项链接的地址
      svg: "material-symbols:home-outline-rounded"
      target: _self
    - id: about
      text: About
      href: /about
      svg: "material-symbols:info-outline-rounded"
      target: _self
    - id: blog
      text: Blogs
      href: /blog
      svg: "material-symbols:book-2-outline-rounded"
      target: _self
      subItems:
        - id: all
          text: All blogs
          href: /blog
          svg: "material-symbols:ink-pen-outline-rounded"
          target: _self
        - id: tech
          text: Tech
          href: /blog/category/Tech
          svg: "material-symbols:unknown-document-outline-rounded"
          target: _self
        - id: novel
          text: Novel
          href: /blog/category/Novel
          svg: "material-symbols:book-outline-rounded"
          target: _self
        - id: article
          text: Article
          href: /blog/category/Article
          svg: "material-symbols:ink-pen-outline-rounded"
          target: _self
        - id: ai
          text: AI
          href: /blog/category/AI
          svg: "lucide:bot"
          target: _self
        - id: resources
          text: Resources
          href: /blog/category/Resources
          svg: "lucide:folder-heart"
          target: _self
        - id: pictures
          text: Pictures
          href: /blog/category/pictures
          svg: "lucide:image"
          target: _self
        - id: photos
          text: Photos
          href: /blog/category/photos
          svg: "lucide:camera"
          target: _self
        # 子菜单项配置
    - id: project
      text: Project
      href: /project
      svg: "material-symbols:code-blocks-outline"
      target: _self
    - id: friend
      text: Friend
      href: /friend
      svg: "material-symbols:supervisor-account-outline-rounded"
      target: _self
    - id: contact
      text: Contact
      href: "mailto:contact.evesunmaple@outlook.com"
      target: _blank # 在新标签页打开
      svg: "material-symbols:attach-email-outline-rounded"

# 用户的个人信息
user:
  name: muyufly # 用户名
  site: "https://muyufly.com" # 用户的网站链接
  avatar: /profile.png # 用户头像路径
  sidebar: # 侧边栏配置
    social:

      - href: "https://github.com/muyufly"
        ariaLabel: Github
        title: Github
        svg: "ri:github-line"
      - href: "https://space.bilibili.com/513741787"
        ariaLabel: BiliBili
        title: BiliBili
        svg: "ri:bilibili-line"
      - href: "https://x.com/muyuflying"
        ariaLabel: X(twitter)
        title: X(twitter)
        svg: "ri:twitter-line"
  footer:
    social:
      - href: "https://github.com/muyufly"
        ariaLabel: Github
        title: Github
        svg: "ri:github-line"
      - href: "https://space.bilibili.com/513741787"
        ariaLabel: BiliBili
        title: BiliBili
        svg: "ri:bilibili-line"
      - href: "https://x.com/muyuflying"
        ariaLabel: X(twitter)
        title: X(twitter)
        svg: "ri:twitter-line"
